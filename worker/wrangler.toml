# 萬用插座・模型代付服務（Cloudflare Worker）
# 部署：Cloudflare 後台「Workers & Pages → Create → Import a repository」選 2738777-ai/agentic-trust-hub，
# 「Root directory（根目錄）」填 worker。祕密 OTARI_KEY 在後台另外設（Secret），不寫在這裡。
name = "trust-hub-llm"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://2738777-ai.github.io"

# 規矩 5：原子計數器（免費方案只能用 SQLite 版的 Durable Object）
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "HubLimits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubLimits"]

# T4 的「別站」：兩個示範夥伴網路，放在這個 Worker 的網域（和 github.io 是不同網域）。
# 有對應檔案的路徑直接回檔案（CORS 見 partners/_headers）；其他路徑（/v1/...）才交給 worker.js。
[assets]
directory = "./partners"
